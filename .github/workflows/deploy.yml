name: Deploy

# Deploys the production build to Vercel whenever code lands on `main`.
#
# Requires two repository secrets:
#   VERCEL_TOKEN   - a Vercel access token (Settings > Tokens)
#   VERCEL_PROJECT_ID - the Vercel project ID (Settings > General)
#
# NOTE: If you connect this repo to Vercel through Vercel's Git
# integration, Vercel already deploys automatically on push and this
# workflow is optional. Keep it only if you prefer a GitHub-driven deploy.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preview build
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          install-command: "npm ci"
          vercel-button: false
